<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password • Yamzz Market</title><link rel="stylesheet" href="css/akun.css"><link rel="icon" href="assets/hero.png"></head><body><main class="account-wrap"><section class="card" style="max-width:520px;margin:60px auto"><div class="account-logo"><img src="assets/hero.png" alt="Yamzz Market"></div><h2>Password Baru</h2><form id="resetForm"><label>Password baru<input id="password" type="password" minlength="8" required placeholder="Minimal 8 karakter"></label><label>Ulangi password<input id="confirm" type="password" minlength="8" required placeholder="Ulangi password"></label><button class="primary" type="submit">Simpan Password</button></form><p id="resetMsg" class="error"></p><a href="akun.html" style="display:block;text-align:center;margin-top:14px;color:#9fb3c8">Kembali ke login</a></section></main><script>document.getElementById("resetForm").onsubmit=async e=>{e.preventDefault();const p=document.getElementById("password").value,c=document.getElementById("confirm").value,m=document.getElementById("resetMsg");if(p!==c){m.textContent="Password tidak sama.";return}const b=e.submitter;b.disabled=true;try{const r=await fetch("/api/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:new URLSearchParams(location.search).get("token"),password:p})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Gagal");m.style.color="#7cf7b1";m.textContent=d.message;setTimeout(()=>location.href="akun.html",1200)}catch(x){m.style.color="#ff9b9b";m.textContent=x.message}finally{b.disabled=false}};</script></body></html>
