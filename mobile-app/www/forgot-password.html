<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lupa Password • Yamzz Market</title><link rel="stylesheet" href="css/akun.css"><link rel="icon" href="assets/hero.png"></head><body><main class="account-wrap"><section class="card" style="max-width:520px;margin:60px auto"><div class="account-logo"><img src="assets/hero.png" alt="Yamzz Market"></div><h2>Lupa Password</h2><p style="color:#91a7bf">Masukkan username, WhatsApp, atau email akun. Jika email tersedia, link reset akan dikirim.</p><form id="forgotForm"><label>Username / WhatsApp / Email<input id="forgotIdentity" required placeholder="username atau email"></label><button class="primary" type="submit">Kirim Link Reset</button></form><p id="forgotMsg" class="error"></p><a href="akun" style="display:block;text-align:center;margin-top:14px;color:#9fb3c8">Kembali ke login</a></section></main><script>document.getElementById("forgotForm").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const m=document.getElementById("forgotMsg");try{const r=await fetch("/api/auth/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identity:document.getElementById("forgotIdentity").value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Gagal");m.style.color="#7cf7b1";m.textContent=d.message||"Permintaan diproses."}catch(x){m.style.color="#ff9b9b";m.textContent=x.message}finally{b.disabled=false}};</script></body></html>
